<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Genesis — From Black Hole to Big Bang to Milky Way</title>
<style>
:root{--ink:#e9eef8;--dim:rgba(210,222,245,.58);--hot:#ffb067;--line:rgba(255,190,120,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
 font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#c.drag{cursor:grabbing}
.ui{position:fixed;z-index:10;transition:opacity 1.2s ease}
.hide{opacity:0!important;pointer-events:none!important}
#brand{top:26px;left:30px}
#brand h1{font-size:13px;font-weight:300;letter-spacing:.55em;text-transform:uppercase}
#brand p{margin-top:7px;font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
#clock{top:26px;right:30px;text-align:right}
#clock .k{font-size:9px;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
#clock .v{margin-top:6px;font-size:20px;font-weight:200;letter-spacing:.12em;color:var(--hot);font-variant-numeric:tabular-nums}
#caption{left:30px;bottom:34px;max-width:min(560px,78vw)}
#caption .t{font-size:clamp(18px,2.4vw,30px);font-weight:200;letter-spacing:.14em}
#caption .s{margin-top:10px;font-size:clamp(11px,1.1vw,14px);line-height:1.7;color:var(--dim);letter-spacing:.06em}
#caption .t,#caption .s{transition:opacity .9s ease,transform .9s ease}
#caption.swap .t,#caption.swap .s{opacity:0;transform:translateY(8px)}
#home{right:16px;bottom:48px;text-align:right}
#bang{pointer-events:auto;cursor:pointer;background:rgba(10,8,6,.45);color:#fff;border:1px solid rgba(255,176,103,.55);
 padding:8px 16px;font:400 10px "Helvetica Neue",Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;border-radius:6px;
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 24px rgba(255,150,60,.18);transition:.25s}
#bang:hover{background:rgba(255,150,60,.16);border-color:#ffb067;box-shadow:0 0 40px rgba(255,150,60,.4);letter-spacing:.32em}
#hint{margin-top:8px;font-size:9px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
#bar{right:48px;bottom:16px;display:flex;gap:6px;align-items:center;opacity:0;pointer-events:none;transform:translateY(6px) scale(.94);transform-origin:bottom right;transition:opacity .25s cubic-bezier(.34,1.56,.64,1),transform .25s cubic-bezier(.34,1.56,.64,1)}
#bar.open{opacity:1;pointer-events:auto;transform:none}
#peek{position:fixed;right:16px;bottom:16px;z-index:11;width:26px;height:26px;border-radius:5px;cursor:pointer;pointer-events:auto;background:rgba(10,12,18,.45);border:1px solid var(--line);color:var(--dim);font:400 12px/24px "Helvetica Neue",Arial,sans-serif;text-align:center;opacity:.6;transition:opacity .25s,border-color .25s,transform .2s}
#peek:hover,#peek.on{opacity:1;border-color:var(--hot);transform:scale(1.06)}
.pill{pointer-events:auto;cursor:pointer;background:rgba(10,12,18,.55);border:1px solid var(--line);color:var(--ink);
 padding:6px 10px;font:400 9px "Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;border-radius:5px;
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.2s}
.pill:hover{border-color:var(--hot);background:rgba(255,150,60,.14)}
#gfx{pointer-events:auto;position:fixed;right:16px;bottom:50px;z-index:20;width:236px;padding:14px;border-radius:8px;
 background:rgba(8,10,16,.86);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 transition:opacity .25s,transform .25s}
#gfx.closed{opacity:0;transform:translateY(8px);pointer-events:none}
#gfx h3{font-size:9px;letter-spacing:.28em;text-transform:uppercase;font-weight:400;color:var(--hot);margin-bottom:10px}
#gfx .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#gfx button{cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:var(--ink);padding:7px 5px;
 border-radius:5px;font:400 9px "Helvetica Neue",Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;transition:.2s}
#gfx button:hover{border-color:var(--hot)}
#gfx button.on{background:rgba(255,150,60,.2);border-color:var(--hot);color:#fff}
#gfx p{margin-top:10px;font-size:9px;line-height:1.5;color:var(--dim);letter-spacing:.04em}
#fps{margin-top:8px;font-size:9px;letter-spacing:.18em;color:var(--dim);font-variant-numeric:tabular-nums}
#tl{left:30px;right:30px;bottom:10px;height:14px;display:flex;align-items:center;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity .35s}
#tl.open{opacity:1}
#tl-track{position:relative;width:100%;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:visible;transition:height .2s}
#tl:hover #tl-track{height:4px;background:rgba(255,255,255,.2)}
#tl-fill{height:100%;width:0%;background:var(--hot);border-radius:2px;box-shadow:0 0 10px var(--hot);position:relative}
.tl-mk{position:absolute;top:50%;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);pointer-events:none}
#tl-tip{position:absolute;bottom:16px;transform:translateX(-50%);padding:4px 7px;border-radius:4px;background:rgba(8,10,16,.9);border:1px solid var(--line);color:var(--ink);font-size:8px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#tl:hover #tl-tip{opacity:1}
#err{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:40px;background:#000;
 color:#ffb4a0;font:13px/1.6 monospace;white-space:pre-wrap}
@media(max-width:700px){#brand{top:16px;left:16px}#clock{top:16px;right:16px}#caption{left:16px;bottom:78px}
 #home{right:12px;bottom:44px}#bar{right:42px;bottom:22px;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 56px)}#peek{right:12px;bottom:22px}.pill{padding:5px 8px;font-size:8px}#gfx{right:12px;bottom:54px}#tl{left:12px;right:12px;bottom:6px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>

<div id="brand" class="ui"><h1>Genesis</h1><p id="sub">Gargantua · Schwarzschild geodesics</p></div>
<div id="clock" class="ui hide"><div class="k">Cosmic time</div><div class="v" id="clockv">—</div></div>
<div id="caption" class="ui hide"><div class="t" id="capt"></div><div class="s" id="caps"></div></div>

<div id="home" class="ui">
  <button id="bang">Initiate Big Bang</button>
  <div id="hint">Drag to orbit · Scroll to zoom</div>
</div>

<div id="bar" class="ui">
  <button class="pill hide" id="pause">Pause</button>
  <button class="pill hide" id="skip">Skip ▸▸</button>
  <button class="pill hide" id="replay">Replay</button>
  <button class="pill" id="snd">Sound on</button>
  <button class="pill" id="gbtn">Graphics: High</button>
  <button class="pill" id="fs">Fullscreen</button>
</div>

<div id="tl" class="ui hide">
  <div id="tl-track"><div id="tl-fill"></div></div>
  <div id="tl-tip"></div>
</div>

<button id="peek" aria-label="Show controls">⋯</button>

<div id="gfx" class="closed">
  <h3>Graphics</h3>
  <div class="row">
    <button data-q="low">Low</button><button data-q="medium">Medium</button>
    <button data-q="high">High</button><button data-q="extreme">Extreme</button>
  </div>
  <p id="gdesc"></p>
  <div id="fps"></div>
</div>

<script>
"use strict";
/* ============================ CORE ============================ */
const $=id=>document.getElementById(id);
const canvas=$('c');
function fatal(msg){const e=$('err');e.style.display='flex';e.textContent=msg;}
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance',preserveDrawingBuffer:false});
if(!gl){fatal('WebGL2 is required for this experience.\nPlease use a current version of Chrome, Edge, Firefox or Safari with hardware acceleration enabled.');throw new Error('no webgl2');}
const extCBF=gl.getExtension('EXT_color_buffer_float');
const extCBH=gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');
const HDR=!!(extCBF||extCBH);
const RT_IFMT=HDR?gl.RGBA16F:gl.RGBA8, RT_TYPE=HDR?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;

const QUALITY={
 low:    {name:'Low',    scale:.55,dpr:1,   steps:130,vol:0,bloom:0,web:40000, mw:90000,  dust:3000,  gal:140,fb:3,aa:0,desc:'Lightweight. Reduced resolution, no bloom, fewer stars. For integrated GPUs and phones.'},
 medium: {name:'Medium', scale:.8, dpr:1.25,steps:210,vol:0,bloom:3,web:130000,mw:260000, dust:9000,  gal:260,fb:4,aa:0,desc:'Balanced. Bloom, volumetric glow and a rich star count.'},
 high:   {name:'High',   scale:1,  dpr:1.5, steps:320,vol:1,bloom:5,web:320000,mw:600000, dust:20000, gal:420,fb:5,aa:0,desc:'Cinematic. Full resolution, volumetric accretion gas, deep bloom.'},
 extreme:{name:'Extreme',scale:1,  dpr:2,   steps:520,vol:1,bloom:6,web:700000,mw:1400000,dust:40000, gal:700,fb:6,aa:1,desc:'Maximum. Native-density rendering, 2-sample ray supersampling, 1.4M star galaxy. Needs a strong GPU.'}
};
let qKey='high';
try{const s=localStorage.getItem('genesis.q');if(s&&QUALITY[s])qKey=s;else if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent))qKey='medium';}catch(e){}
let Q=QUALITY[qKey];

function compile(type,src,label){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    const num=src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n');
    console.error(label+'\n'+log+'\n'+num);
    throw new Error('Shader compile failed ['+label+']: '+log);
  }
  return s;
}
function program(vs,fs,label,defs){
  const pre='#version 300 es\n'+(defs||'');
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,pre+vs,label+' VS'));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,pre+fs,label+' FS'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('Link failed ['+label+']: '+gl.getProgramInfoLog(p));
  const U={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,a.name);}
  return {p,U};
}
function createRT(w,h,linear){
  w=Math.max(1,w|0);h=Math.max(1,h|0);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,RT_IFMT,w,h,0,gl.RGBA,RT_TYPE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,linear?gl.LINEAR:gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,linear?gl.LINEAR:gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return {tex,fb,w,h};
}
function freeRT(r){if(!r)return;gl.deleteTexture(r.tex);gl.deleteFramebuffer(r.fb);}
const emptyVAO=gl.createVertexArray();

/* ---- math ---- */
const _mp=new Float32Array(16),_ml=new Float32Array(16),_mv=new Float32Array(16);
const _mr=new Float32Array(3),_mu=new Float32Array(3),_mf=new Float32Array(3);
const M={
 persp(f,a,n,fa){const t=1/Math.tan(f/2),r=1/(n-fa);_mp[0]=t/a;_mp[5]=t;_mp[10]=(n+fa)*r;_mp[11]=-1;_mp[14]=2*n*fa*r;return _mp;},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  _ml[0]=xx;_ml[1]=yx;_ml[2]=zx;_ml[3]=0;_ml[4]=xy;_ml[5]=yy;_ml[6]=zy;_ml[7]=0;_ml[8]=xz;_ml[9]=yz;_ml[10]=zz;_ml[11]=0;
  _ml[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);_ml[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);_ml[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);_ml[15]=1;
  _mr[0]=xx;_mr[1]=xy;_mr[2]=xz;_mu[0]=yx;_mu[1]=yy;_mu[2]=yz;_mf[0]=-zx;_mf[1]=-zy;_mf[2]=-zz;
  return {m:_ml,right:_mr,up:_mu,fwd:_mf};},
 mul(a,b,o){o=o||_mv;for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
 clamp:(x,a,b)=>Math.min(b,Math.max(a,x)),
 mix:(a,b,t)=>a+(b-a)*t,
 sstep(a,b,x){const t=M.clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);},
 ease:t=>{t=M.clamp(t,0,1);return t*t*(3-2*t);}
};
/* ===================== GLSL: shared library ===================== */
const GLSL_COMMON=`
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash31(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
vec3 hash33(vec3 p3){p3=fract(p3*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yxz+33.33);return fract((p3.xxy+p3.yxx)*p3.zyx);}
float vnoise(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm3(vec3 p,int oct){
  float v=0.,a=.5;
  for(int i=0;i<7;i++){ if(i>=oct)break; v+=a*vnoise(p); p=p*2.03+vec3(11.7,3.1,7.3); a*=.5; }
  return v/(1.-pow(.5,float(oct)));
}
vec3 blackbody(float T){
  T=clamp(T,1000.,40000.)/100.;
  vec3 c;
  c.r=T<=66.?1.:clamp(1.292936186*pow(T-60.,-.1332047592),0.,1.);
  c.g=T<=66.?clamp(.3900815788*log(T)-.6318414438,0.,1.):clamp(1.129890861*pow(T-60.,-.0755148492),0.,1.);
  c.b=T>=66.?1.:(T<=19.?0.:clamp(.5432067891*log(T-10.)-1.19625408914,0.,1.));
  return pow(c,vec3(2.2));
}
mat2 rot2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
`;
/* shared vertex helpers: integer hashing for GPU-generated particles */
const GLSL_PCG=`
uint pcg(uint v){uint s=v*747796405u+2891336053u;uint w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
float rnd(uint id,uint k){return float(pcg(id*1664525u+k*1013904223u+k))/4294967295.0;}
`;
const FS_TRI=`
out vec2 vUV;
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUV=p; gl_Position=vec4(p*2.-1.,0.,1.); }
`;
/* ===================== GLSL: Schwarzschild black hole ===================== */
const BH_FS=`
precision highp float;precision highp int;
in vec2 vUV;
uniform vec2 u_res;uniform float u_time;
uniform vec3 u_cam,u_right,u_up,u_fwd;
uniform float u_th,u_m,u_gal,u_expo,u_disk;
uniform int u_steps,u_vol,u_aa;
out vec4 o;
`+GLSL_COMMON+`
#define RIN 3.0
#define ROUT 14.0
#define RB 110.0

/* ---- sky: procedural stars + Milky Way (dense golden core when u_gal -> 1) ---- */
vec3 starLayer(vec3 d,float N,float dens,float pixA,float seed,float bright){
  vec3 pp=d*N;vec3 cell=floor(pp);vec3 f=pp-cell;
  if(hash31(cell+seed)>dens)return vec3(0.);
  vec3 o3=.2+.6*hash33(cell+seed*3.7);
  vec3 dv=f-o3;dv-=d*dot(dv,d);
  float base=.055;
  float sig=min(max(base,pixA*N*.7),.13);
  float mag=pow(hash31(cell*1.7+seed*9.1),5.);
  float fall=exp(-dot(dv,dv)/(2.*sig*sig));
  float flux=bright*(.12+mag*16.)*(base*base)/(sig*sig);
  vec3 c=blackbody(mix(3000.,13000.,pow(hash31(cell+17.3),.8)));
  return c*fall*flux;
}
vec3 sky(vec3 d,float pixA){
  float G=u_gal;
  vec3 NG=normalize(vec3(.35,.82,.45));
  vec3 ex=normalize(cross(NG,vec3(0.,0.,1.)));vec3 ey=cross(NG,ex);
  float b=dot(d,NG);
  float width=mix(.16,.55,G);
  float band=exp(-b*b/(2.*width*width));
  float cl=fbm3(d*4.+3.,5),cl2=fbm3(d*12.,3);
  float dn=band*(.3+1.0*cl);
  float bulge=exp(-(1.-dot(d,ex))*mix(7.,1.4,G));
  float dl=abs(fbm3(d*6.5+9.,5)-.5)*2.;
  float dust=smoothstep(.34,.0,dl)*exp(-b*b/(2.*width*width*.2))*.88;
  vec3 mw=vec3(.50,.58,.85)*dn*.075+vec3(1.,.70,.40)*bulge*(.25+band)*.11*mix(1.,2.5,G);
  mw+=vec3(.9,.45,.5)*pow(cl2,3.)*band*.03*(1.+G*2.);
  mw*=(1.-dust);
  mw*=mix(1.,.55,G);
  float dm=1.+2.5*band*(1.-dust*.8)+G*2.;
  vec3 st=starLayer(d,40.,.05,pixA,1.,1.)
         +starLayer(d,85.,.05*dm,pixA,2.,.7)
         +starLayer(d,180.,.06*dm,pixA,3.,.5)
         +starLayer(d,380.,.07*dm,pixA,4.,.4);
  st*=mix(1.,.55,dust*.8)*mix(1.,.6,G);
  return mw+st+vec3(.002,.0025,.005)*(.5+cl);
}

/* ---- thin accretion disk, Doppler + gravitational shift (Novikov-Thorne-like temperature) ---- */
vec3 diskEmit(vec3 hp,vec3 v,bool detail,out float dens){
  float rd=length(hp.xz);
  float beta=.82*sqrt(.5/max(rd-1.,.2));
  vec3 tg=vec3(-hp.z,0.,hp.x)/rd;
  float gam=inversesqrt(1.-beta*beta);
  float gd=1./(gam*(1.+beta*dot(tg,v)));
  float gg=sqrt(max(1.-1./rd,.02));
  float g=gd*gg;
  float f=pow(rd/3.,-.75)*pow(max(1.-sqrt(3./rd),.07),.25)/.49;
  float Tobs=6100.*f*pow(g,.55);
  float a=atan(hp.z,hp.x);
  float w=2.6/(rd*sqrt(rd));
  float aa=a-w*u_time;
  vec2 cs=vec2(cos(aa),sin(aa));
  float n1=detail?fbm3(vec3(cs*1.8,rd*5.2),5):fbm3(vec3(cs*1.8,rd*5.2),2);
  float n2=detail?vnoise(vec3(cs*6.,rd*15.+7.)):.5;
  float edge=smoothstep(RIN,RIN+.45,rd)*(1.-smoothstep(ROUT-5.,ROUT,rd));
  float fall=exp(-(rd-RIN)*.1);
  dens=clamp(edge*fall*(.2+1.35*n1)*(.55+.9*n2)*1.15,0.,1.)*u_disk;
  float I=pow(clamp(Tobs/5200.,0.,1.7),2.4)*clamp(pow(g,1.4),.25,1.8);
  return blackbody(Tobs)*I;
}

vec3 trace(vec2 fc){
  vec2 uv=(2.*fc-u_res)/u_res.y;
  vec3 rd=normalize(u_right*uv.x*u_th+u_up*uv.y*u_th+u_fwd);
  float pixA=2.*u_th/u_res.y;
  vec3 p=u_cam/max(u_m,.02),v=rd;
  vec3 col=vec3(0.);float T=1.;
  bool inside=true,hit=false;
  if(length(p)>RB){
    float bb=dot(p,v),cc=dot(p,p)-RB*RB,disc=bb*bb-cc;
    if(disc<0.||bb>0.)inside=false; else p+=v*(-bb-sqrt(disc));
  }
  float minR=1e5;
  if(inside){
    vec3 L=cross(p,v);float h2=dot(L,L);
    for(int i=0;i<640;i++){
      if(i>=u_steps)break;
      float r=length(p);
      minR=min(minR,r);
      if(r<1.){hit=true;break;}

in vec3 vCol;in float vA;out vec4 o;
void main(){
  vec2 d=gl_PointCoord-.5;float r2=dot(d,d)*4.;
  if(r2>1.)discard;
  o=vec4(vCol*exp(-r2*3.4)*vA,1.);
}
`;
const DUST_VS=`
precision highp float;precision highp int;
`+MW_COMMON+`
uniform int u_mode;
out vec3 vCol;out float vA;
void main(){
  uint id=uint(gl_VertexID);
  float u1=max(rnd(id,2u),1e-4),u2=max(rnd(id,3u),1e-4);
  float r=2.0-3.3*(log(u1)+log(u2));if(r>18.5)r=2.2+mod(r,16.3);
  float arm=pickArm(rnd(id,6u));
  float th,y,szw,alpha;vec3 col;
  if(u_mode==0){
    /* Dark molecular dust lanes hugging the inner/concave edge of the spiral arms & bar */
    th=armTheta(r,arm)+.12+gauss(id,7u)*.08;
    y=gauss(id,9u)*.075;szw=.45+.9*rnd(id,12u);alpha=.1;col=vec3(0.);
  }else{
    /* Diffuse warm core glow, blue spiral arm reflection nebulae & pink H-II emission clouds */
    th=armTheta(r,arm)+gauss(id,7u)*.13;
    y=gauss(id,9u)*.07;szw=.35+.75*rnd(id,12u);alpha=.0065;
    float k=rnd(id,13u);
    if(r<4.2)col=vec3(1.,.78,.48);
    else col=k<.52?vec3(.45,.64,1.):(k<.82?vec3(.96,.78,.56):vec3(.98,.32,.54));
  }
  vec3 fin=vec3(r*cos(th),y,-r*sin(th));
  float delay=.18+clamp(r/22.,0.,1.)*.25+rnd(id,40u)*.25;
  float gp=clamp((u_g-delay)/.5,0.,1.);
  float e=gp*gp*(3.-2.*gp);
  vec3 start=protoPos(id,fin,r);
  vec3 pos=rotY((1.-e)*4.2)*mix(start,fin,e);
  pos=rotY(u_rot)*pos;
  vec4 cp=u_vp*vec4(pos,1.);
  gl_Position=cp;
  float dist=max(cp.w,.01);
  float px=clamp(szw*u_pxs/dist,3.,MAXPT);
  gl_PointSize=px;
  vCol=col;
  vA=alpha*gp*smoothstep(.22,.8,u_g)*((arm==0.||arm==2.)?smoothstep(3.2,5.2,r):smoothstep(5.5,8.5,r))*u_bright*(u_mode==1?1.55:1.)*min(1.,(u_pxs*szw/dist)/px+.2)*smoothstep(2.5,14.,dist);
}
`;
const DUST_FS=`
precision highp float;precision highp int;
in vec3 vCol;in float vA;uniform int u_mode;out vec4 o;
void main(){
  vec2 d=gl_PointCoord-.5;float r2=dot(d,d)*4.;
  if(r2>1.)discard;
  float a=exp(-r2*3.)*vA;
  if(u_mode==0)o=vec4(0.,0.,0.,min(a,.9));
  else o=vec4(vCol*a,1.);
}
`;

/* ---- bloom + tone-mapping + film ---- */
const DOWN_FS=`
precision highp float;in vec2 vUV;uniform sampler2D u_src;uniform vec2 u_texel;uniform int u_first;out vec4 o;
vec3 s(vec2 k){vec3 c=texture(u_src,vUV+k*u_texel).rgb;return min(c,vec3(50.));}
void main(){
  vec3 a=s(vec2(-2,2)),b=s(vec2(0,2)),c=s(vec2(2,2)),d=s(vec2(-2,0)),e=s(vec2(0,0)),f=s(vec2(2,0)),
       g=s(vec2(-2,-2)),h=s(vec2(0,-2)),i=s(vec2(2,-2)),j=s(vec2(-1,1)),k=s(vec2(1,1)),l=s(vec2(-1,-1)),m=s(vec2(1,-1));
  vec3 r=e*.125+(a+c+g+i)*.03125+(b+d+f+h)*.0625+(j+k+l+m)*.125;
  if(u_first==1){float lum=dot(r,vec3(.2126,.7152,.0722));r*=smoothstep(.25,1.1,lum)*.9+.1*min(lum,1.);}
  o=vec4(r,1.);
}
`;
const UP_FS=`
precision highp float;in vec2 vUV;uniform sampler2D u_src;uniform vec2 u_texel;uniform float u_w;out vec4 o;
void main(){
  vec3 r=texture(u_src,vUV).rgb*4.;
  r+=2.*(texture(u_src,vUV+vec2(u_texel.x,0.)).rgb+texture(u_src,vUV-vec2(u_texel.x,0.)).rgb+texture(u_src,vUV+vec2(0.,u_texel.y)).rgb+texture(u_src,vUV-vec2(0.,u_texel.y)).rgb);
  r+=texture(u_src,vUV+u_texel).rgb+texture(u_src,vUV-u_texel).rgb+texture(u_src,vUV+vec2(u_texel.x,-u_texel.y)).rgb+texture(u_src,vUV+vec2(-u_texel.x,u_texel.y)).rgb;
  o=vec4(r/16.*u_w,1.);
}
`;
const POST_FS=`
precision highp float;in vec2 vUV;
uniform sampler2D u_hdr,u_bloom;uniform float u_bloomAmt,u_expo,u_time,u_black,u_ca,u_grain,u_flash,u_warp;uniform vec2 u_res;
out vec4 o;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  if(u_black>.5){o=vec4(0.,0.,0.,1.);return;}
  vec2 uv=vUV,cc=uv-.5;float rr=dot(cc,cc);
  vec2 off=cc*rr*u_ca;
  vec3 c=vec3(texture(u_hdr,uv+off).r,texture(u_hdr,uv).g,texture(u_hdr,uv-off).b);
  if(u_warp>.002){
    c=vec3(0.);
    for(int i=0;i<10;i++){
      vec2 wu=.5+cc*(1.-u_warp*float(i)/9.);
      c+=vec3(texture(u_hdr,wu+off).r,texture(u_hdr,wu).g,texture(u_hdr,wu-off).b);
    }
    c*=.1;
  }
  c+=texture(u_bloom,uv).rgb*u_bloomAmt;
  c*=u_expo;
  c+=u_flash*vec3(1.,.95,.88);
  c*=1.-.55*smoothstep(.1,.62,rr);
  c=aces(c*.88);
  float l=dot(c,vec3(.299,.587,.114));
  c=mix(vec3(l),c,1.05);
  c=pow(c,vec3(1./2.2));
  float n=fract(sin(dot(uv*u_res+fract(u_time)*113.,vec2(12.9898,78.233)))*43758.5453)-.5;
  c+=n*u_grain*(1.-.6*l);
  o=vec4(c,1.);
}
`;
const GX_FS=`
precision highp float;precision highp int;
in vec2 vUV;
uniform vec2 u_res;uniform float u_time,u_th,u_rot,u_g,u_gx,u_bright;
uniform vec3 u_cam,u_right,u_up,u_fwd;
uniform int u_ns;
out vec4 o;
`+GLSL_COMMON+`
#define GPI 3.14159265
#define GRBAR 3.8
#define GBAR 0.42
float wrapA(float a){return a-6.2831853*floor((a+GPI)/6.2831853);}
float gArm(float r,float k){
  bool mj=(k<.5||(k>1.5&&k<2.5));
  float r0=mj?GRBAR:GRBAR*1.45;
  float w=log(max(r,r0)/r0)*(mj?4.4:4.75);
  return GBAR+k*GPI*.5+w*smoothstep(1.2,GRBAR*1.15,r);
}
/* x: arm brightness, y: dust lane (inner edge of each arm), z: HII line (just inside the arm ridge) */
vec3 armField(float r,float th){
  vec3 f=vec3(0.);
  for(int i=0;i<4;i++){
    float k=float(i);
    bool mj=(i==0||i==2);
    float gate=mj?smoothstep(2.4,5.2,r):smoothstep(4.,8.,r);
    float sg=mj?(.20+.018*r):(.26+.020*r);
    float d=wrapA(th-gArm(r,k));
    f.x+=(mj?1.:.8)*gate*exp(-d*d/(2.*sg*sg));
    float dd=d-(.15+.009*r),sd=.11+.007*r;
    f.y+=gate*exp(-dd*dd/(2.*sd*sd));
    float dh=d-(.05+.004*r),sh=.07+.004*r;
    f.z+=gate*exp(-dh*dh/(2.*sh*sh));
  }
  return f;
}
vec3 diskEm(vec2 F){
  float r0=length(F);
  float e=u_g*u_g*(3.-2.*u_g);
  vec2 Fb=rot2((1.-e)*(3.6+5.5/(1.+.35*r0)))*F;
  float r=length(Fb);
  float th=atan(Fb.y,Fb.x+1e-5);
  vec3 af=armField(r,th)*smoothstep(.3,.9,u_g);
  float m=af.x;
  float rev=1.-smoothstep(u_g*26.-5.,u_g*26.+1.,r);
  float edge=rev/(1.+exp((r-15.1)/1.2));
  float prof=(.58+.42*exp(-r/8.5))*edge;
  float cl=fbm3(vec3(Fb*.5,2.3),4);
  float fl=fbm3(vec3(Fb*1.7,8.1),3);
  float fn=vnoise(vec3(Fb*5.5,4.4));
  /* fine wound sub-arms: the flocculent, many-armed look of the inner disk */
  float phi=th-5.3*log(max(r,1.));
  float rip=.5+.5*cos(7.*phi+4.*fl);
  float rg=smoothstep(2.5,5.5,r)*(1.-smoothstep(12.,17.,r));
  rip=1.-rg*.55*(1.-rip);
  float lum=prof*(.62+.62*m*(.55+.9*cl))*(.72+.56*fl)*(.85+.3*fn)*(.55+.45*rip);
  vec3 st=mix(vec3(1.,.78,.58),vec3(.62,.72,1.),smoothstep(4.,13.,r));
  st=mix(st,vec3(.68,.78,1.),clamp(m,0.,1.)*.35*smoothstep(5.,10.,r));
  /* reddish-brown dust lanes */
  float dn=fbm3(vec3(Fb*1.3,5.5),3);
  float dn2=vnoise(vec3(Fb*4.,1.2));
  float lane=clamp(af.y,0.,1.2)*(.15+1.*smoothstep(.38,.66,dn))*(.45+.8*dn2);
  lane=max(lane,(1.-rip)*rg*.55*(.4+.9*smoothstep(.35,.7,dn)));
  float tau=lane*smoothstep(.5,1.4,r)*1.35*(1.7-.9*smoothstep(6.,12.,r)-.4*smoothstep(12.,17.,r));
  vec3 T=exp(-tau*vec3(.42,.90,1.25));
  /* pink H-II star-forming knots clustered along the inner edge of the arms */
  float cluster=smoothstep(.38,.7,fbm3(vec3(Fb*.7,9.9),3));
  float kn=smoothstep(.52,.86,fbm3(vec3(Fb*2.4,3.3),3));
  float kk=kn*clamp(af.z,0.,1.)*cluster*smoothstep(4.5,8.,r)*edge;
  vec3 hii=mix(vec3(1.,.27,.50),vec3(1.,.80,.88),clamp(kk*1.3,0.,1.))*kk*1.8;
  vec3 haze=vec3(.95,.34,.55)*clamp(af.z,0.,1.)*cluster*fl*.05*smoothstep(5.,9.,r)*edge;
  return st*lum*.38*T+hii+haze;
}
/* line integral of an anisotropic gaussian blob (bar axis rotated by GBAR) along a ray: exact, so the bar and bulge are true 3D */
float gline(vec3 po,vec3 pd,vec3 s,float ca,float sa){
  vec3 o2=vec3(po.x*ca+po.y*sa,-po.x*sa+po.y*ca,po.z);
  vec3 d2=vec3(pd.x*ca+pd.y*sa,-pd.x*sa+pd.y*ca,pd.z);
  vec3 is=1./(s*s);
  float a=dot(d2*d2,is),b=dot(o2*d2,is),c=dot(o2*o2,is);
  return sqrt(6.2831853/a)*exp(-.5*(c-b*b/a));
}
float barLane(vec2 F){
  float cb=cos(GBAR),sb=sin(GBAR);
  float u=F.x*cb+F.y*sb,v=-F.x*sb+F.y*cb;
  float vl=v+sign(u)*(.9+.1*abs(u));
  return exp(-vl*vl/(2.*.22*.22))*(1.-smoothstep(1.6,3.6,abs(u)))*smoothstep(0.,.7,abs(u));
}
void main(){
  vec2 uv=(2.*gl_FragCoord.xy-u_res)/u_res.y;
  vec3 rd=normalize(u_right*uv.x*u_th+u_up*uv.y*u_th+u_fwd);
  mat2 toF=rot2(u_rot);
  vec3 og=vec3(toF*vec2(u_cam.x,-u_cam.z),u_cam.y);
  vec3 dg=vec3(toF*vec2(rd.x,-rd.z),rd.y);
  vec2 F0=vec2(1e3);
  if(abs(dg.z)>1e-4){float t0=-og.z/dg.z;if(t0>0.)F0=og.xy+dg.xy*t0;}
  bool hit0=F0.x<5e2;
  /* thin disk: a few slices through the plane so it keeps some depth when orbited */
  vec3 dsum=vec3(0.);float wsum=0.;
  for(int i=0;i<5;i++){
    if(i>=u_ns)break;
    float yi=(float(i)-float(u_ns-1)*.5)*.55;
    float w=exp(-abs(yi)/.5);
    wsum+=w;
    if(abs(dg.z)<1e-4)continue;
    float t=(yi-og.z)/dg.z;
    if(t<=0.)continue;
    vec2 F=og.xy+dg.xy*t;
    if(dot(F,F)>576.)continue;
    dsum+=w*diskEm(F);
  }
  dsum/=max(wsum,1e-3);
  /* central bar + boxy bulge, warm orange-cream */
  float cb=cos(GBAR),sb=sin(GBAR);
  float bf=mix(.55,1.,smoothstep(.25,.9,u_g));
  vec3 core=vec3(1.,.86,.64)*.38*gline(og,dg,vec3(1.05,.92,.80),cb,sb)
           +vec3(1.,.72,.42)*.85*gline(og,dg,vec3(2.1*bf,.68,.55),cb,sb)
           +vec3(.96,.66,.38)*.075*gline(og,dg,vec3(3.8,1.9,1.1),cb,sb)
           +vec3(.95,.62,.36)*.022*gline(og,dg,vec3(3.4,3.0,1.8),cb,sb);
  float sbd=(u_g-.46)/.15;
  core+=vec3(.72,.84,1.)*.26*exp(-sbd*sbd)*gline(og,dg,vec3(1.7,1.4,1.1),cb,sb);
  if(hit0){
    float tb=.7*barLane(F0)*(.6+.8*fbm3(vec3(F0*1.3,3.3),3));
    core*=exp(-tb*vec3(.45,.95,1.4));
  }
  core*=smoothstep(.05,.5,u_g);
  /* faint navy sky and the soft blue halo around the disk */
  vec3 amb=vec3(.0010,.0019,.0036);
  if(hit0)amb+=vec3(.0055,.0075,.016)*exp(-dot(F0,F0)/200.);
  /* small satellite dwarf galaxy to the upper left */
  vec3 sat=vec3(0.);
  if(hit0&&u_g>.4){
    vec2 dv=F0-mix(vec2(-21.,41.),vec2(-6.38,15.58),smoothstep(.4,.97,u_g));
    vec2 ds=rot2(.17)*dv;
    float sgl=exp(-(ds.x*ds.x/(2.*.55*.55)+ds.y*ds.y/(2.*.28*.28)));
    sat=(vec3(1.,.92,.72)*sgl*.85+vec3(.75,.82,1.)*exp(-dot(dv,dv)/(2.*1.1*1.1))*.08)*smoothstep(.45,.8,u_g);
  }
  /* collapsing proto-galactic gas halo: violet cloud with clumpy cooling flows that shrinks into the disk */
  vec3 halo=vec3(0.);
  float hA=smoothstep(.02,.14,u_g)*(1.-smoothstep(.4,.9,u_g));
  if(hA>.002){
    float hr=mix(15.,6.5,smoothstep(0.,.8,u_g));
    vec3 pcn=og-dg*dot(og,dg);
    float hn=fbm3(pcn*.28+vec3(0.,0.,u_time*.03),4);
    float hz=gline(og,dg,vec3(hr,hr*.8,hr),1.,0.);
    halo=mix(vec3(.30,.34,.85),vec3(1.,.55,.35),smoothstep(.45,.9,hn))*hz*.0022*(.35+1.5*hn*hn)*hA;
  }
  /* the Sun: a pulsing marker on the Orion Spur, 8.2 kpc from the center */
  vec3 sunm=vec3(0.);
  if(hit0&&u_g>.9){
    float ts=gArm(8.2,2.)+.55;
    float sd=length(F0-8.2*vec2(cos(ts),sin(ts)));
    float pu=.5+.5*sin(u_time*3.);
    sunm=vec3(1.,.82,.5)*(exp(-sd*sd/.016)*1.4+exp(-(sd-.5)*(sd-.5)/.007)*(.35+.65*pu))*smoothstep(.9,1.,u_g);
  }
  o=vec4(((dsum+core+amb+sat)*u_gx+halo+sunm)*u_bright,1.);
}
`;
/* ============================ RENDERER ============================ */
const MAXPT=Math.min(140,gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1]);
const P={};
function buildPrograms(){
  P.bh  =program(FS_TRI,BH_FS,'blackhole');
  P.fire=program(FS_TRI,FIRE_FS,'fireball');
  P.web =program(WEB_VS,WEB_FS,'web');
  P.gal =program(GAL_VS,GAL_FS,'galaxies');
  P.mw  =program(MW_VS,MW_FS,'milkyway');
  P.gx  =program(FS_TRI,GX_FS,'galaxyportrait');
  P.dust=program(DUST_VS,DUST_FS,'dust','#define MAXPT '+MAXPT.toFixed(1)+'\n');
  P.down=program(FS_TRI,DOWN_FS,'down');
  P.up  =program(FS_TRI,UP_FS,'up');
  P.post=program(FS_TRI,POST_FS,'post');
}
const u1f=(pr,n,v)=>{const l=pr.U[n];if(l!==undefined&&l!==null)gl.uniform1f(l,v);};
const u1i=(pr,n,v)=>{const l=pr.U[n];if(l!==undefined&&l!==null)gl.uniform1i(l,v);};
const u2f=(pr,n,a,b)=>{const l=pr.U[n];if(l)gl.uniform2f(l,a,b);};
const u3v=(pr,n,v)=>{const l=pr.U[n];if(l)gl.uniform3f(l,v[0],v[1],v[2]);};
const um4=(pr,n,m)=>{const l=pr.U[n];if(l)gl.uniformMatrix4fv(l,false,m);};

let hdr=null,bloomRT=[],cw=1,ch=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,Q.dpr);
  cw=Math.max(2,Math.floor(innerWidth*dpr));ch=Math.max(2,Math.floor(innerHeight*dpr));
  canvas.width=cw;canvas.height=ch;
  freeRT(hdr);bloomRT.forEach(freeRT);bloomRT=[];
  hdr=createRT(cw*Q.scale,ch*Q.scale,true);
  let w=hdr.w>>1,h=hdr.h>>1;
  for(let i=0;i<Q.bloom;i++){bloomRT.push(createRT(Math.max(2,w),Math.max(2,h),true));w>>=1;h>>=1;}
}
function makeCam(eye,target,fovDeg,near,far){
  const L=M.look(eye,target,[0,1,0]);
  const f=fovDeg*Math.PI/180,asp=hdr.w/hdr.h;
  const pr=M.persp(f,asp,near||.05,far||600);
  const th=Math.tan(f/2);
  return {eye,vp:M.mul(pr,L.m),right:L.right,up:L.up,fwd:L.fwd,th,pxs:hdr.h/(2*th)};
}
const fsq=()=>{gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.TRIANGLES,0,3);};

function drawBH(cam,o){
  const p=P.bh;gl.useProgram(p.p);
  u2f(p,'u_res',hdr.w,hdr.h);u1f(p,'u_time',o.time);
  u3v(p,'u_cam',cam.eye);u3v(p,'u_right',cam.right);u3v(p,'u_up',cam.up);u3v(p,'u_fwd',cam.fwd);
  u1f(p,'u_th',cam.th);u1f(p,'u_m',o.m);u1f(p,'u_gal',o.gal);u1f(p,'u_expo',o.expo);u1f(p,'u_disk',o.disk);
  u1i(p,'u_steps',Q.steps);u1i(p,'u_vol',Q.vol);u1i(p,'u_aa',Q.aa);
  fsq();
}
function drawFire(cam,o){
  const p=P.fire;gl.useProgram(p.p);
  u2f(p,'u_res',hdr.w,hdr.h);u1f(p,'u_time',o.time);
  u3v(p,'u_cam',cam.eye);u3v(p,'u_right',cam.right);u3v(p,'u_up',cam.up);u3v(p,'u_fwd',cam.fwd);
  u1f(p,'u_th',cam.th);u1f(p,'u_R',o.R);u1f(p,'u_T',o.T);u1f(p,'u_dens',o.dens);u1f(p,'u_gain',o.gain);
  u1f(p,'u_turb',o.turb);u1f(p,'u_cmb',o.cmb);u1f(p,'u_rim',o.rim);u1f(p,'u_core',o.core);u1f(p,'u_shock',o.shock);
  u1i(p,'u_n',Q.fb*16);
  fsq();
}
function additive(){gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);}
function drawWeb(cam,o){
  const p=P.web;gl.useProgram(p.p);additive();
  um4(p,'u_vp',cam.vp);u3v(p,'u_cam',cam.eye);
  u1f(p,'u_D',o.D);u1f(p,'u_box',o.box);u1f(p,'u_pxs',cam.pxs);u1f(p,'u_bright',o.bright*(3.2e5/Q.web)*.9);
  u1f(p,'u_time',o.time);u1f(p,'u_stars',o.stars);
  gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.POINTS,0,Q.web);
}
function drawGal(cam,o){
  const p=P.gal;gl.useProgram(p.p);additive();
  um4(p,'u_vp',cam.vp);u3v(p,'u_cam',cam.eye);u3v(p,'u_camR',cam.right);u3v(p,'u_camU',cam.up);
  u1f(p,'u_D',o.D);u1f(p,'u_box',o.box);u1f(p,'u_pxs',cam.pxs);u1f(p,'u_gsize',o.gsize);u1f(p,'u_vis',o.vis);u1f(p,'u_bright',o.bright);
  u1f(p,'u_time',time);
  gl.bindVertexArray(emptyVAO);gl.drawArraysInstanced(gl.TRIANGLES,0,12,Q.gal);
}
function drawGX(cam,o){
  const p=P.gx;gl.useProgram(p.p);additive();
  u2f(p,'u_res',hdr.w,hdr.h);u1f(p,'u_time',o.time);
  u3v(p,'u_cam',cam.eye);u3v(p,'u_right',cam.right);u3v(p,'u_up',cam.up);u3v(p,'u_fwd',cam.fwd);
  u1f(p,'u_th',cam.th);u1f(p,'u_rot',o.rot);u1f(p,'u_g',o.g);u1f(p,'u_gx',o.gx);u1f(p,'u_bright',o.abright);
  u1i(p,'u_ns',Q.aa?5:(Q.vol?3:1));
  fsq();
}
function drawMW(cam,o){
  drawGX(cam,o);
  gl.bindVertexArray(emptyVAO);

function auInit(){

    const ng=c.createGain();ng.gain.value=.05;ns.connect(bp).connect(ng).connect(AU.drone);ns.start();
    const lfo=c.createOscillator();lfo.frequency.value=.07;const lg=c.createGain();lg.gain.value=140;lfo.connect(lg).connect(lp.frequency);lfo.start();

  drag=true;canvas.classList.add('drag');orb.vy=0;orb.vp=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=mode==='seq'?orb.sz:orb.dist;}
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>6)p.moved=true;
  if(ptrs.size===2){
    p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>0){
      if(mode==='seq')orb.sz=M.clamp(dist0*pinch0/d,.45,2.4);
      else orb.dist=M.clamp(dist0*pinch0/d,7,70);
    }
    return;
  }
  const dx=(e.clientX-p.x)*.005,dy=(e.clientY-p.y)*.005;
  if(mode==='seq'){orb.sy-=dx;orb.sp=M.clamp(orb.sp+dy,-.9,.9);}
  else{orb.yaw-=dx;orb.pitch=M.clamp(orb.pitch+dy,-1.45,1.45);orb.vy=-dx;orb.vp=dy;}
  p.x=e.clientX;p.y=e.clientY;
});
const endPtr=e=>{
  const p=ptrs.get(e.pointerId);
  if(p&&!p.moved&&e.type==='pointerup'&&ptrs.size===1)toggleBar();
  ptrs.delete(e.pointerId);if(!ptrs.size){drag=false;canvas.classList.remove('drag');}
};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(mode==='seq')orb.sz=M.clamp(orb.sz*Math.exp(e.deltaY*.001),.45,2.4);
  else orb.vd+=e.deltaY*.0012;
},{passive:false});
let rszTimer=0;
addEventListener('resize',()=>{clearTimeout(rszTimer);rszTimer=setTimeout(resize,60);});
document.addEventListener('visibilitychange',()=>{
  if(!AU.ctx)return;
  if(document.hidden)AU.ctx.suspend?.();
  else if(AU.on)AU.ctx.resume?.();
});
/* ============================ SCENE DIRECTOR ============================ */
const lerp=M.mix,sst=M.sstep,ez=M.ease;
/* galactic camera rail: monotone cubic spline through keyframes [b,yaw,pitch,dist,fov,tx,ty,tz]; the Sun sits on the Orion Spur at 8.2 kpc */
const SUN_R=8.2;
function armJS(r,k){const mj=(k===0||k===2),r0=mj?3.8:5.51,w=Math.log(Math.max(r,r0)/r0)*(mj?4.4:4.75);return .42+k*Math.PI*.5+w*sst(1.2,4.37,r);}
const SUN=(()=>{const th=armJS(SUN_R,2)+.55,x=SUN_R*Math.cos(th),z=-SUN_R*Math.sin(th),c=Math.cos(.38),s=Math.sin(.38);return [x*c+z*s,0,-x*s+z*c];})();
const SYAW=(a=>a<0?a+Math.PI*2:a)(Math.atan2(SUN[0],SUN[2]));
const CK=[[67,-1.15,.32,84,52,0,0,0],[82,-.55,.52,70,50,0,0,0],[98,.15,.85,58,50,0,0,0],[114,.75,1.36,50,50,0,0,0],
 [122,.95,1.30,43,48,0,0,0],[128,1.25,.16,37,46,0,0,0],[134,1.8,.10,31,44,0,0,0],
 [140,SYAW-.75,.52,22,46,SUN[0],0,SUN[2]],[147,SYAW-.05,.44,19,44,SUN[0],0,SUN[2]],[153,SYAW+.1,.38,17,46,SUN[0],0,SUN[2]],
 [162,SYAW+.42,.2,7,64,SUN[0]*.3,0,SUN[2]*.3],[171,SYAW+.8,.12,1.8,58,0,0,0],[260,SYAW+.8,.12,1.8,58,0,0,0]];
const _ck=[0,0,0,0,0,0,0];
function ckTan(i,j){
  const n=CK.length;
  if(i<=0||i>=n-1){const a=i<=0?0:n-2;return (CK[a+1][j+1]-CK[a][j+1])/(CK[a+1][0]-CK[a][0]);}
  const h0=CK[i][0]-CK[i-1][0],h1=CK[i+1][0]-CK[i][0];
  const d0=(CK[i][j+1]-CK[i-1][j+1])/h0,d1=(CK[i+1][j+1]-CK[i][j+1])/h1;
  if(d0*d1<=0)return 0;
  const w1=2*h1+h0,w2=h1+2*h0;
  return (w1+w2)/(w1/d0+w2/d1);
}
function camKey(b){
  const n=CK.length;
  let i=0;
  b=M.clamp(b,CK[0][0],CK[n-1][0]-1e-6);
  while(i<n-2&&b>CK[i+1][0])i++;
  const h=CK[i+1][0]-CK[i][0],s=(b-CK[i][0])/h,s2=s*s,s3=s2*s;
  const h00=2*s3-3*s2+1,h10=s3-2*s2+s,h01=-2*s3+3*s2,h11=s3-s2;
  for(let j=0;j<7;j++)_ck[j]=h00*CK[i][j+1]+h10*h*ckTan(i,j)+h01*CK[i+1][j+1]+h11*h*ckTan(i+1,j);
  return _ck;
}
function renderScene(){
  beginScene();
  const o={expo:1,black:false,flash:0,bloom:.38};
  if(mode==='home'||mode==='final'){
    drawBH(makeCam(bhEye(orb.yaw,orb.pitch,orb.dist),[0,0,0],BH_FOV),{time,m:1,gal:0,expo:1,disk:1});
    o.bloom=.1;return o;
  }
  const t=seqT;
  if(t<1.2){                                   // the home black hole is pulled in and swallowed
    const k=ez(t/1.2);
    drawBH(makeCam(bhEye(orb.yaw+k*.9,orb.pitch,orb.dist*(1-.5*k)),[0,0,0],BH_FOV),{time,m:1,gal:0,expo:1-k,disk:1});
    return o;
  }
  if(t<TB){o.black=true;return o;}             // 5.0 s of absolute darkness
  const b=t-TB;
  if(b<24){                                    // ---- Big Bang fireball ----
    const R=b<1.38?.003*Math.exp(b*4.2):1+4*(1-Math.exp(-(b-1.38)*.5));
    let T=3000+57000*Math.exp(-b/3.2);if(b>16)T*=Math.max(.45,1-(b-16)*.07);
    const sk=Math.exp(-b*1.5),ee=bhEye(.5+.12*b+orb.sy,M.clamp(.25+orb.sp,-1.4,1.4),12*orb.sz);
    ee[0]+=Math.sin(b*71)*.35*sk;ee[1]+=Math.cos(b*57)*.3*sk;ee[2]+=Math.sin(b*43)*.25*sk;
    const cam=makeCam(ee,[0,0,0],50+16*sk);
    drawFire(cam,{time,R,T,dens:.8,gain:(b<16?1:1-sst(16,24,b))*.3*Math.min(1,Math.pow(8000/T,1.2)),turb:3.2,cmb:sst(9,16,b)*1.1,rim:1.2*Math.exp(-b/2.2),
      core:b<3.5?1.8*Math.exp(-b*.8):0,shock:Math.exp(-b/1.5)});
    o.expo=.8;
    o.flash=b<.7?Math.pow(1-b/.7,2)*1.3:0;
    o.warp=.55*Math.exp(-b*2.2);
  }
  if(b>=20&&b<67.5){                           // ---- dark ages, cosmic web, galaxies ----
    const D=.05+2.0*M.clamp((b-20)/48,0,1);
    const fade=1-ez((b-63)/3.5);
    _eye[0]=18*Math.sin(.045*b);_eye[1]=8*Math.sin(.031*b+1);_eye[2]=-28+.8*(b-20);
    const tb=b+3;
    const dx=18*Math.sin(.045*tb)-_eye[0],dy=8*Math.sin(.031*tb+1)-_eye[1],dz=-28+.8*(tb-20)-_eye[2];
    const cy=Math.cos(orb.sy),sy=Math.sin(orb.sy),cp=Math.cos(orb.sp),sp=Math.sin(orb.sp);
    const rx=dx*cy+dz*sy,rz=-dx*sy+dz*cy;
    _tg[0]=_eye[0]+rx*cp;_tg[1]=_eye[1]+dy*cp+Math.hypot(rx,rz)*sp;_tg[2]=_eye[2]+rz*cp;
    const cam=makeCam(_eye,_tg,M.clamp((55+7*Math.sin(.17*b)-10*sst(50,66,b))*orb.sz,28,85));
    drawWeb(cam,{D,box:90,bright:sst(21,28,b)*fade,time,stars:sst(28,40,b)*.9*fade});
    if(b>=34)drawGal(cam,{D,box:90,gsize:1.6*(1+.4*sst(38,66,b)),vis:sst(34,66,b),bright:.9*fade});
    o.warp=.32*sst(56,64,b)*(1-sst(64,67,b));
    o.expo=1.0;
  }
  if(b>=67){                                   // ---- Milky Way assembles, then the central black hole forms ----
    const fin=ez((b-67)/4);
    const g=M.clamp((b-70)/50,0,1);
    const kc=camKey(b),asp=Math.max(1,.8/(hdr.w/hdr.h)),rot=.38+3.0*(1-g)*(1-g);
    const yaw=kc[0]+orb.sy,pitch=M.clamp(kc[1]+orb.sp,-1.45,1.45),dist=kc[2]*asp*orb.sz;
    const bhk=sst(170,177,b);
    if(bhk>0){
      drawBH(makeCam(bhEye(orb.yaw+orb.sy,M.clamp(orb.pitch+orb.sp,-1.45,1.45),orb.dist*orb.sz),[0,0,0],BH_FOV),
        {time,m:ez((b-171)/9),gal:1-sst(174,182,b),expo:bhk,disk:sst(178,184,b)});
    }
    const ey=bhEye(yaw,pitch,dist);ey[0]+=kc[4];ey[1]+=kc[5];ey[2]+=kc[6];
    const cam=makeCam(ey,[kc[4],kc[5],kc[6]],kc[3],.03,300);
    drawMW(cam,{g,rot,gx:sst(.22,.85,g),abright:fin*(1-bhk),bright:fin*(1-bhk)*1.18,time});
    const pl=M.clamp((b-153)/18,0,1),ps=Math.sin(Math.PI*pl);
    o.warp=Math.max(.4*(1-sst(67,74,b)),.5*ps*ps);
    o.expo=1.0;o.bloom=lerp(.18,.1,bhk);
  }
  return o;
}
function updateHUD(){
  if(mode!=='seq'){return;}
  el.tlFill.style.width=M.clamp(seqT/(TB+END_B)*100,0,100).toFixed(2)+'%';
  const b=seqT-TB;
  if(b<0){el.clockv.textContent='—';setCaption(-1,'','');return;}
  el.clockv.textContent=fmtCosmic(cosmicLog(b));
  let idx=0;for(let i=0;i<CH.length;i++)if(b>=CH[i][0]+.2)idx=i;
  setCaption(idx,CH[idx][1],CH[idx][2]);
}
let FREEZE=false;
let fpsAcc=0,fpsN=0,fpsShow=0,fpsLowFor=0;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=(now-last)/1000,dt=Math.min(.25,rawDt);last=now;time+=dt;
  const damp=Math.exp(-dt*7);
  if(mode==='seq'){
    if(!FREEZE)seqT+=dt;
    if(!drag){orb.sy*=Math.exp(-dt*1.2);orb.sp*=Math.exp(-dt*1.2);orb.sz=lerp(orb.sz,1,1-Math.exp(-dt*1.2));}
    if(seqT>=TB+END_B)goFinal();
  }else{
    if(!drag){
      orb.yaw+=orb.vy+dt*.025;orb.pitch=M.clamp(orb.pitch+orb.vp,-1.45,1.45);
      orb.vy*=damp;orb.vp*=damp;
    }
    if(Math.abs(orb.vd)>1e-4){orb.dist=M.clamp(orb.dist*Math.exp(orb.vd),7,70);orb.vd*=damp;}
  }
  updateHUD();
  const o=renderScene();o.time=time;
  present(o);
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>.5){
    fpsShow=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
    el.fps.textContent=fpsShow.toFixed(0)+' FPS · '+hdr.w+'×'+hdr.h;
    if(fpsShow<20&&(qKey==='high'||qKey==='extreme')){fpsLowFor+=.5;if(fpsLowFor>6)el.gdesc.textContent='Low frame rate detected — try a lower preset for smoother playback.';}
    else fpsLowFor=Math.max(0,fpsLowFor-.5);
  }
}

/* ============================ BOOT ============================ */
try{
  buildPrograms();
  const H=location.hash.replace('#','').split('&').reduce((a,s)=>{const [k,v]=s.split('=');if(k)a[k]=v;return a;},{});
  if(H.q&&QUALITY[H.q])qKey=H.q;
  setQuality(qKey);
  if(H.t!==undefined){startSeq(parseFloat(H.t)||0);if(parseFloat(H.t)>0)el.home.classList.add('hide');}
  if(H.final)goFinal();
  FREEZE=!!H.freeze;
  window.__genesis={get mode(){return mode;},set seqT(v){seqT=v;},get seqT(){return seqT;},go:startSeq,Q:()=>Q};
  requestAnimationFrame(t=>{last=t;frame(t);});
}catch(err){console.error(err);fatal('Rendering could not start.\n\n'+(err&&err.message?err.message:err));}
</script>
